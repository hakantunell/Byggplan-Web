name: Add draggable dimension offsets
on:
  push:
    paths:
      - '.github/workflows/dimension-offset.yml'
      - '.github/scripts/dimension_offset.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python3 .github/scripts/dimension_offset.py
      - name: Build app
        run: npm ci && npm run build
      - name: Build Studio
        run: cd studio && npm ci && npm run build
      - name: Commit result and cleanup
        run: |
          git config user.name "byggplan-bot"
          git config user.email "byggplan-bot@users.noreply.github.com"
          git add studio/src/ProjectDocumentsWorkspace.tsx src/DrawingAnnotations.tsx
          git commit -m "Add draggable offset dimension lines" || true
          git rm .github/workflows/dimension-offset.yml .github/scripts/dimension_offset.py
          git commit -m "Remove dimension offset patch workflow" || true
          git push
