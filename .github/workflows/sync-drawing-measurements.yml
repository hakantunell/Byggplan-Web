name: Sync drawing measurements between Studio and app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-drawing-measurements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch shared drawing measurement storage
        shell: python
        run: |
          from pathlib import Path

          studio=Path('studio/src/ProjectDocumentsWorkspace.tsx')
          s=studio.read_text()
          marker="const STORAGE_PREFIX='byggplan.drawingMeasurements.v1.';"
          helpers="""const STORAGE_PREFIX='byggplan.drawingMeasurements.v1.';\n\nasync function loadSharedState(projectId:string):Promise<DrawingState>{\n const local=readState(projectId);\n try{\n  const r=await fetch(`/api/project-drawing-measurements?projectId=${encodeURIComponent(projectId)}`,{cache:'no-store'});\n  if(!r.ok)return local;\n  const data=await r.json() as {state?:DrawingState};\n  const remote=data.state&&typeof data.state==='object'?data.state:{};\n  if(Object.keys(remote).length)return remote;\n  if(Object.keys(local).length){await saveSharedState(projectId,local);return local}\n  return {};\n }catch{return local}\n}\nasync function saveSharedState(projectId:string,state:DrawingState){\n writeState(projectId,state);\n try{await fetch('/api/project-drawing-measurements',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId,state})})}catch{}\n}\n"""
          assert marker in s
          s=s.replace(marker,helpers,1)
          old="useEffect(()=>{setStates(readState(projectId));void loadDocuments()},[projectId]);"
          new="useEffect(()=>{let cancelled=false;setStates(readState(projectId));void loadSharedState(projectId).then(state=>{if(!cancelled)setStates(state)});void loadDocuments();return()=>{cancelled=true}},[projectId]);"
          assert old in s
          s=s.replace(old,new,1)
          old2="function updatePage(next:PageState){if(!stateKey)return;setStates(current=>{const value={...current,[stateKey]:next};writeState(projectId,value);return value})}"
          new2="function updatePage(next:PageState){if(!stateKey)return;setStates(current=>{const value={...current,[stateKey]:next};void saveSharedState(projectId,value);return value})}"
          assert old2 in s
          s=s.replace(old2,new2,1)
          studio.write_text(s)

          app=Path('src/DrawingAnnotations.tsx')
          a=app.read_text()
          old3="function readDrawingState(projectId:string):DrawingState{\n  if(!projectId)return {};\n  try{return JSON.parse(localStorage.getItem(DRAWING_STORAGE_PREFIX+projectId)||'{}') as DrawingState}catch{return {}}\n}"
          new3=old3+"""\nasync function loadDrawingState(projectId:string):Promise<DrawingState>{\n  const local=readDrawingState(projectId);\n  try{\n    const r=await fetch(`${annotationApi('/project-drawing-measurements')}?projectId=${encodeURIComponent(projectId)}`,{cache:'no-store'});\n    if(!r.ok)return local;\n    const data=await r.json() as {state?:DrawingState};\n    return data.state&&typeof data.state==='object'?data.state:local;\n  }catch{return local}\n}"""
          assert old3 in a
          a=a.replace(old3,new3,1)
          old4="useEffect(()=>{setDrawingState(readDrawingState(projectId));setShowMeasurements(true)},[projectId,file.id]);"
          new4="useEffect(()=>{let cancelled=false;setDrawingState(readDrawingState(projectId));setShowMeasurements(true);void loadDrawingState(projectId).then(state=>{if(!cancelled)setDrawingState(state)});return()=>{cancelled=true}},[projectId,file.id]);"
          assert old4 in a
          a=a.replace(old4,new4,1)
          app.write_text(a)
      - name: Build app
        run: npm install --progress=false && npm run build
      - name: Build Studio
        working-directory: studio
        run: npm install --progress=false && npm run build
      - name: Commit result and cleanup workflow
        shell: bash
        run: |
          git config user.name "byggplan-bot"
          git config user.email "byggplan-bot@users.noreply.github.com"
          rm .github/workflows/sync-drawing-measurements.yml
          git add studio/src/ProjectDocumentsWorkspace.tsx src/DrawingAnnotations.tsx .github/workflows/sync-drawing-measurements.yml
          git commit -m "Persist and share drawing measurements across Studio and app"
          git push
