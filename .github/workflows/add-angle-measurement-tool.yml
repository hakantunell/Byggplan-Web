name: Add angle measurement tool

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-angle-measurement-tool.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/add_angle_patch.py
      - name: Build app
        run: npm install --progress=false && npm run build
      - name: Build Studio
        working-directory: studio
        run: npm install --progress=false && npm run build
      - name: Commit result and cleanup
        run: |
          git config user.name "byggplan-bot"
          git config user.email "byggplan-bot@users.noreply.github.com"
          rm .github/workflows/add-angle-measurement-tool.yml scripts/add_angle_patch.py
          git add studio/src/ProjectDocumentsWorkspace.tsx src/DrawingAnnotations.tsx .github/workflows/add-angle-measurement-tool.yml scripts/add_angle_patch.py
          git commit -m "Add angle measurement tool to drawings"
          git push
