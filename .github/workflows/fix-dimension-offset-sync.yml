name: Fix dimension offset sync
on:
  push:
    paths:
      - '.github/workflows/fix-dimension-offset-sync.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch offset persistence and app refresh
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('studio/src/ProjectDocumentsWorkspace.tsx')
          s=p.read_text()
          old=" const canvasRef=useRef<HTMLCanvasElement|null>(null);const imageRef=useRef<HTMLImageElement|null>(null);const stageRef=useRef<HTMLDivElement|null>(null);const viewportRef=useRef<HTMLDivElement|null>(null);"
          new=old+"const offsetSaveTimerRef=useRef<number|null>(null);"
          assert old in s
          s=s.replace(old,new,1)
          old=" function setMeasurementOffset(id:string,offset:number,final:boolean){if(!stateKey)return;setStates(current=>{const currentPage=current[stateKey]||{measurements:[]};const nextPage={...currentPage,measurements:currentPage.measurements.map(m=>m.id===id?{...m,offset}:m)};const value={...current,[stateKey]:nextPage};if(final)void saveSharedState(projectId,value);else writeState(projectId,value);return value})}"
          new=" function setMeasurementOffset(id:string,offset:number,final:boolean){if(!stateKey)return;setStates(current=>{const currentPage=current[stateKey]||{measurements:[]};const nextPage={...currentPage,measurements:currentPage.measurements.map(m=>m.id===id?{...m,offset}:m)};const value={...current,[stateKey]:nextPage};writeState(projectId,value);if(offsetSaveTimerRef.current!=null)window.clearTimeout(offsetSaveTimerRef.current);offsetSaveTimerRef.current=window.setTimeout(()=>{void saveSharedState(projectId,value);offsetSaveTimerRef.current=null},final?0:180);return value})}"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/DrawingAnnotations.tsx')
          a=p.read_text()
          needle="  useEffect(()=>{let cancelled=false;setDrawingState(readDrawingState(projectId));setShowMeasurements(true);void loadDrawingState(projectId).then(state=>{if(!cancelled)setDrawingState(state)});return()=>{cancelled=true}},[projectId,file.id]);"
          assert needle in a
          add=needle+"\n  useEffect(()=>{let cancelled=false;const refresh=()=>{void loadDrawingState(projectId).then(state=>{if(!cancelled)setDrawingState(state)})};const onVisible=()=>{if(document.visibilityState==='visible')refresh()};window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',onVisible);return()=>{cancelled=true;window.removeEventListener('focus',refresh);document.removeEventListener('visibilitychange',onVisible)}},[projectId]);"
          a=a.replace(needle,add,1)
          p.write_text(a)
          PY
      - name: Build app
        run: npm install && npm run build
      - name: Build Studio
        run: cd studio && npm install && npm run build
      - name: Commit result and cleanup
        shell: bash
        run: |
          git config user.name "byggplan-bot"
          git config user.email "byggplan-bot@users.noreply.github.com"
          git add studio/src/ProjectDocumentsWorkspace.tsx src/DrawingAnnotations.tsx
          git commit -m "Make dimension offset sync robust" || true
          git rm .github/workflows/fix-dimension-offset-sync.yml
          git commit -m "Remove dimension offset sync fix workflow" || true
          git push
