name: Restore project data flow
on:
  push:
    branches:
      - main
    paths:
      - studio/scripts/restore_project_data_flow.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable data flow and fix selection
        run: python studio/scripts/restore_project_data_flow.py
      - name: Build Studio
        working-directory: studio
        run: npm ci && npm run build
      - name: Commit result
        run: |
          git config user.name byggplan-bot
          git config user.email byggplan-bot@users.noreply.github.com
          rm studio/scripts/restore_project_data_flow.py
          rm .github/workflows/restore-project-data-flow.yml
          git add studio/src/ProjectWorkspace.tsx studio/src/ProjectActivitiesView.tsx studio/src/ProjectAdministrationEditor.tsx studio/src/ProjectConditionsView.tsx studio/src/ProjectsView.tsx studio/src/StudioShell.tsx studio/src/project-data-cache.ts studio/scripts/restore_project_data_flow.py .github/workflows/restore-project-data-flow.yml
          git commit -m "Restore stable project data loading and fix project submenu selection"
          git push
