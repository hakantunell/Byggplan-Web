name: Fix drawing bounds and palette reload
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-drawing-bounds-and-palette-reload.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply drawing bounds patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('studio/src/ProjectDocumentsWorkspace.tsx')
          s=p.read_text()
          old=""" const min=Math.max(1,Math.min(size.w,size.h));
 const geometry=(m:Measurement)=>{const ax=m.a.x*size.w,ay=m.a.y*size.h,bx=m.b.x*size.w,by=m.b.y*size.h;const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,off=(m.offset||0)*min;return{ax,ay,bx,by,a2x:ax+nx*off,a2y:ay+ny*off,b2x:bx+nx*off,b2y:by+ny*off,mx:(ax+bx)/2+nx*off,my:(ay+by)/2+ny*off,nx,ny}};
 const offsetFromEvent=(m:Measurement,e:React.PointerEvent<SVGLineElement>)=>{const target=targetRef.current;if(!target)return m.offset||0;const r=target.getBoundingClientRect(),g=geometry(m);const ox=(m.a.x+m.b.x)*size.w/2,oy=(m.a.y+m.b.y)*size.h/2;return (((e.clientX-r.left)-ox)*g.nx+((e.clientY-r.top)-oy)*g.ny)/min};
"""
          new=""" const min=Math.max(1,Math.min(size.w,size.h));
 const clampOffset=(m:Measurement,value:number)=>{const ax=m.a.x*size.w,ay=m.a.y*size.h,bx=m.b.x*size.w,by=m.b.y*size.h,dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,mx=(ax+bx)/2,my=(ay+by)/2,text=formatMm(measuredMm(m)),label=m.label?`${m.label} · ${text}`:text,boxW=Math.max(36,label.length*5.6+10);let lo=-Infinity,hi=Infinity;const add=(base:number,dir:number,minEdge:number,maxEdge:number)=>{if(Math.abs(dir)<1e-9)return;const a=(minEdge-base)/dir,b=(maxEdge-base)/dir;lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b))};add(ax,nx,3,size.w-3);add(ay,ny,3,size.h-3);add(bx,nx,3,size.w-3);add(by,ny,3,size.h-3);add(mx,nx,boxW/2+3,size.w-boxW/2-3);add(my,ny,11,size.h-11);if(lo>hi)return 0;const px=value*min;return Math.max(lo,Math.min(hi,px))/min};
 const geometry=(m:Measurement)=>{const ax=m.a.x*size.w,ay=m.a.y*size.h,bx=m.b.x*size.w,by=m.b.y*size.h;const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,off=clampOffset(m,m.offset||0)*min;return{ax,ay,bx,by,a2x:ax+nx*off,a2y:ay+ny*off,b2x:bx+nx*off,b2y:by+ny*off,mx:(ax+bx)/2+nx*off,my:(ay+by)/2+ny*off,nx,ny}};
 const offsetFromEvent=(m:Measurement,e:React.PointerEvent<SVGLineElement>)=>{const target=targetRef.current;if(!target)return clampOffset(m,m.offset||0);const r=target.getBoundingClientRect(),g=geometry(m);const ox=(m.a.x+m.b.x)*size.w/2,oy=(m.a.y+m.b.y)*size.h/2;const raw=(((e.clientX-r.left)-ox)*g.nx+((e.clientY-r.top)-oy)*g.ny)/min;return clampOffset(m,raw)};
"""
          if old not in s:
              raise SystemExit('DimensionOverlay target block not found')
          s=s.replace(old,new,1)

          old2="""const off=a.labelOffset||{x:0,y:0};const lx=cx+Math.cos(mid)*(r+20)+off.x*size.w,ly=cy+Math.sin(mid)*(r+20)+off.y*size.h;return{cx,cy,ax,ay,bx,by,arc,lx,ly,deg:abs*180/Math.PI,r}};"""
          new2="""const off=a.labelOffset||{x:0,y:0},deg=abs*180/Math.PI,rawLx=cx+Math.cos(mid)*(r+20)+off.x*size.w,rawLy=cy+Math.sin(mid)*(r+20)+off.y*size.h,text=a.label?`${a.label} · ${formatAngle(deg)}`:formatAngle(deg),boxW=Math.max(38,text.length*5.8+10),lx=Math.max(boxW/2+4,Math.min(size.w-boxW/2-4,rawLx)),ly=Math.max(12,Math.min(size.h-12,rawLy));return{cx,cy,ax,ay,bx,by,arc,lx,ly,deg,r}};"""
          if old2 not in s:
              raise SystemExit('AngleOverlay geometry target block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path('studio/src/drawing-palette-bridge.ts')
          s=p.read_text()
          marker='export function installDrawingPaletteBridge(){'
          if marker not in s:
              raise SystemExit('Palette bridge install marker not found')
          addition="""export function installDrawingPaletteBridge(){
 window.addEventListener('byggplan:drawing-palette-reload',()=>{if(currentBody){loadState();renderPalette();renderOverlay()}});"""
          s=s.replace(marker,addition,1)
          p.write_text(s)
          PY
      - name: Build Studio
        working-directory: studio
        run: npm ci && npm run build
      - name: Commit patch and remove workflow
        run: |
          git config user.name "byggplan-bot"
          git config user.email "byggplan-bot@users.noreply.github.com"
          rm .github/workflows/fix-drawing-bounds-and-palette-reload.yml
          git add studio/src/ProjectDocumentsWorkspace.tsx studio/src/drawing-palette-bridge.ts .github/workflows/fix-drawing-bounds-and-palette-reload.yml
          git commit -m "Keep drawing edits inside canvas and reload shared palette"
          git push
