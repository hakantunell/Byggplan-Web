name: Workspace project target selector
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workspace-project-target-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply target selector patch
        run: python scripts/workspace_project_target_patch.py
      - name: Build app
        run: npm install --progress=false && npm run build
      - name: Build Studio
        working-directory: studio
        run: npm install --progress=false && npm run build
      - name: Commit result and cleanup
        run: |
          git config user.name "byggplan-bot"
          git config user.email "byggplan-bot@users.noreply.github.com"
          rm .github/workflows/workspace-project-target-patch.yml scripts/workspace_project_target_patch.py
          git add studio/src/MasterProjectsView.tsx studio/src/StudioShell.tsx .github/workflows/workspace-project-target-patch.yml scripts/workspace_project_target_patch.py
          git commit -m "Let project creation target a workspace"
          git push
