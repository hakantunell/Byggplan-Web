name: Fix dimension offset persistence v2
on:
  push:
    paths:
      - '.github/workflows/fix-dimension-offset-persistence-v2.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch offset persistence and app refresh
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('studio/src/ProjectDocumentsWorkspace.tsx')
          s=p.read_text()
          old="function setMeasurementOffset(id:string,offset:number,final:boolean){if(!stateKey)return;setStates(current=>{const currentPage=current[stateKey]||{measurements:[]};const nextPage={...currentPage,measurements:currentPage.measurements.map(m=>m.id===id?{...m,offset}:m)};const value={...current,[stateKey]:nextPage};writeState(projectId,value);if(offsetSaveTimerRef.current!=null)window.clearTimeout(offsetSaveTimerRef.current);offsetSaveTimerRef.current=window.setTimeout(()=>{void saveSharedState(projectId,value);offsetSaveTimerRef.current=null},final?0:180);return value})}"
          new="function setMeasurementOffset(id:string,offset:number,final:boolean){if(!stateKey)return;setStates(current=>{const currentPage=current[stateKey]||{measurements:[]};const nextPage={...currentPage,measurements:currentPage.measurements.map(m=>m.id===id?{...m,offset}:m)};const value={...current,[stateKey]:nextPage};writeState(projectId,value);if(final){if(offsetSaveTimerRef.current!=null){window.clearTimeout(offsetSaveTimerRef.current);offsetSaveTimerRef.current=null}void saveSharedState(projectId,value)}else if(offsetSaveTimerRef.current==null){offsetSaveTimerRef.current=window.setTimeout(()=>{const latest=readState(projectId);void saveSharedState(projectId,latest);offsetSaveTimerRef.current=null},180)}return value})}"
          assert old in s, 'setMeasurementOffset pattern missing'
          s=s.replace(old,new,1)
          old="onPointerUp={e=>{if(dragRef.current?.id!==m.id)return;e.stopPropagation();onOffsetChange(m.id,offsetFromEvent(m,e),true);dragRef.current=null}} onPointerCancel={()=>{dragRef.current=null}}"
          new="onPointerUp={e=>{if(dragRef.current?.id!==m.id)return;e.stopPropagation();onOffsetChange(m.id,offsetFromEvent(m,e),true);dragRef.current=null}} onPointerCancel={e=>{if(dragRef.current?.id===m.id)onOffsetChange(m.id,offsetFromEvent(m,e),true);dragRef.current=null}} onLostPointerCapture={e=>{if(dragRef.current?.id===m.id){onOffsetChange(m.id,offsetFromEvent(m,e),true);dragRef.current=null}}}"
          assert old in s, 'pointer handler pattern missing'
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/DrawingAnnotations.tsx')
          a=p.read_text()
          old="useEffect(()=>{let cancelled=false;const refresh=()=>{void loadDrawingState(projectId).then(state=>{if(!cancelled)setDrawingState(state)})};const onVisible=()=>{if(document.visibilityState==='visible')refresh()};window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',onVisible);return()=>{cancelled=true;window.removeEventListener('focus',refresh);document.removeEventListener('visibilitychange',onVisible)}},[projectId]);"
          new="useEffect(()=>{let cancelled=false;const refresh=()=>{void loadDrawingState(projectId).then(state=>{if(!cancelled)setDrawingState(state)})};const onVisible=()=>{if(document.visibilityState==='visible')refresh()};window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',onVisible);const id=window.setInterval(()=>{if(document.visibilityState==='visible')refresh()},1500);return()=>{cancelled=true;window.clearInterval(id);window.removeEventListener('focus',refresh);document.removeEventListener('visibilitychange',onVisible)}},[projectId]);"
          assert old in a, 'app refresh effect pattern missing'
          a=a.replace(old,new,1)
          p.write_text(a)
          PY
      - name: Build app
        run: npm install && npm run build
      - name: Build Studio
        run: cd studio && npm install && npm run build
      - name: Commit result and cleanup
        shell: bash
        run: |
          git config user.name "byggplan-bot"
          git config user.email "byggplan-bot@users.noreply.github.com"
          git add studio/src/ProjectDocumentsWorkspace.tsx src/DrawingAnnotations.tsx
          git commit -m "Fix dimension offset persistence and refresh" || true
          git rm .github/workflows/fix-dimension-offset-persistence-v2.yml
          git commit -m "Remove dimension offset persistence workflow" || true
          git push