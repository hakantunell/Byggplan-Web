name: Apply drawing bounds patch
on:
  push:
    branches:
      - main
    paths:
      - studio/scripts/apply_drawing_bounds_patch.py
      - .github/workflows/apply-drawing-bounds-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python studio/scripts/apply_drawing_bounds_patch.py
      - name: Build Studio
        working-directory: studio
        run: npm ci && npm run build
      - name: Commit result
        run: |
          git config user.name byggplan-bot
          git config user.email byggplan-bot@users.noreply.github.com
          rm studio/scripts/apply_drawing_bounds_patch.py
          rm .github/workflows/apply-drawing-bounds-patch.yml
          git add studio/src/ProjectDocumentsWorkspace.tsx studio/src/drawing-palette-bridge.ts studio/scripts/apply_drawing_bounds_patch.py .github/workflows/apply-drawing-bounds-patch.yml
          git commit -m "Keep drawing edits inside canvas and reload shared palette"
          git push
