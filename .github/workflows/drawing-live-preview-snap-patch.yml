name: Apply drawing live preview and snap patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drawing-live-preview-snap-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch drawing measurement interaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('studio/src/ProjectDocumentsWorkspace.tsx')
          s=p.read_text()

          old="function pointFromEvent(e:React.PointerEvent<HTMLDivElement>):Point|null{const target=isPdf?canvasRef.current:imageRef.current;if(!target)return null;const rect=target.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)return null;return{x:(e.clientX-rect.left)/rect.width,y:(e.clientY-rect.top)/rect.height}}"
          new="""function pointFromEvent(e:React.PointerEvent<HTMLDivElement>):Point|null{const target=isPdf?canvasRef.current:imageRef.current;if(!target)return null;const rect=target.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)return null;return{x:(e.clientX-rect.left)/rect.width,y:(e.clientY-rect.top)/rect.height}}\n function snapPoint(origin:Point,point:Point,enabled:boolean):Point{if(!enabled)return point;const target=isPdf?canvasRef.current:imageRef.current;if(!target)return point;const rect=target.getBoundingClientRect();const dx=(point.x-origin.x)*rect.width,dy=(point.y-origin.y)*rect.height;const length=Math.hypot(dx,dy);if(!length)return point;const step=Math.PI/4;const angle=Math.round(Math.atan2(dy,dx)/step)*step;return{x:origin.x+Math.cos(angle)*length/rect.width,y:origin.y+Math.sin(angle)*length/rect.height}}\n function previewPoint(point:Point|null,shift:boolean){return point&&pending.length===1?snapPoint(pending[0],point,shift):point}"""
          assert old in s, 'pointFromEvent block not found'
          s=s.replace(old,new,1)

          old="function handleStageClick(e:React.PointerEvent<HTMLDivElement>){if(tool==='hand'||!attachment)return;const point=pointFromEvent(e);if(!point)return;const next=[...pending,point];"
          new="function handleStageClick(e:React.PointerEvent<HTMLDivElement>){if(tool==='hand'||!attachment)return;let point=pointFromEvent(e);if(!point)return;if(pending.length===1)point=snapPoint(pending[0],point,e.shiftKey);const next=[...pending,point];"
          assert old in s, 'handleStageClick start not found'
          s=s.replace(old,new,1)

          old="<div ref={stageRef} className=\"drawingStage\" onPointerDown={handleStageClick} onPointerMove={e=>setCursorPoint(tool==='hand'?null:pointFromEvent(e))} onPointerLeave={()=>setCursorPoint(null)}>"
          new="<div ref={stageRef} className=\"drawingStage\" onPointerDown={handleStageClick} onPointerMove={e=>{const raw=tool==='hand'?null:pointFromEvent(e);setCursorPoint(previewPoint(raw,e.shiftKey))}} onPointerLeave={()=>setCursorPoint(null)}>"
          assert old in s, 'drawingStage handlers not found'
          s=s.replace(old,new,1)

          old="<DrawingOverlay targetRef={isPdf?canvasRef:imageRef} pageState={pageState} pending={pending} tool={tool} showMeasurements={showMeasurements} measuredMm={measuredMm}/><Magnifier"
          new="<DrawingOverlay targetRef={isPdf?canvasRef:imageRef} pageState={pageState} pending={pending} cursorPoint={cursorPoint} tool={tool} showMeasurements={showMeasurements} measuredMm={measuredMm}/><Magnifier"
          assert old in s, 'DrawingOverlay invocation not found'
          s=s.replace(old,new,1)

          old="function DrawingOverlay({targetRef,pageState,pending,tool,showMeasurements,measuredMm}:{targetRef:React.RefObject<HTMLCanvasElement|null>|React.RefObject<HTMLImageElement|null>;pageState:PageState;pending:Point[];tool:Tool;showMeasurements:boolean;measuredMm:(m:Measurement)=>number}){"
          new="function DrawingOverlay({targetRef,pageState,pending,cursorPoint,tool,showMeasurements,measuredMm}:{targetRef:React.RefObject<HTMLCanvasElement|null>|React.RefObject<HTMLImageElement|null>;pageState:PageState;pending:Point[];cursorPoint:Point|null;tool:Tool;showMeasurements:boolean;measuredMm:(m:Measurement)=>number}){"
          assert old in s, 'DrawingOverlay signature not found'
          s=s.replace(old,new,1)

          marker="{pending.map((pt,i)=>{const q=p(pt);return <circle key={i} className=\"pendingPoint\" cx={q.x} cy={q.y} r=\"6\"/>})}"
          insert="{pending.length===1&&cursorPoint&&(()=>{const a=p(pending[0]),b=p(cursorPoint);return <g className=\"measurementPreview\"><line x1={a.x} y1={a.y} x2={b.x} y2={b.y}/><circle cx={b.x} cy={b.y} r=\"4\"/></g>})()}"+marker
          assert marker in s, 'pending point marker not found'
          s=s.replace(marker,insert,1)

          p.write_text(s)

          p=Path('studio/src/project-documents-workspace.css')
          s=p.read_text()
          marker='.pendingPoint{fill:#fff;stroke:#c66e19;stroke-width:3}'
          insert='.measurementPreview line{stroke:#d07a22;stroke-width:1.8;stroke-dasharray:5 4}.measurementPreview circle{fill:#fff;stroke:#d07a22;stroke-width:2}'+marker
          assert marker in s, 'pendingPoint css marker not found'
          s=s.replace(marker,insert,1)
          p.write_text(s)
          PY
          git config user.name "byggplan-bot"
          git config user.email "byggplan-bot@users.noreply.github.com"
          git rm .github/workflows/drawing-live-preview-snap-patch.yml
          git add studio/src/ProjectDocumentsWorkspace.tsx studio/src/project-documents-workspace.css
          git commit -m "Add live measurement preview and 45 degree shift snapping"
          git push
