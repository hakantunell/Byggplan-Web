name: Apply touch measurement patch
on:
  push:
    branches:
      - main
    paths:
      - studio/scripts/apply_touch_measure_patch.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python studio/scripts/apply_touch_measure_patch.py
      - name: Build Studio
        working-directory: studio
        run: npm ci && npm run build
      - name: Commit result
        run: |
          git config user.name byggplan-bot
          git config user.email byggplan-bot@users.noreply.github.com
          rm studio/scripts/apply_touch_measure_patch.py
          rm .github/workflows/apply-touch-measure-patch.yml
          git add studio/src/ProjectDocumentsWorkspace.tsx studio/scripts/apply_touch_measure_patch.py .github/workflows/apply-touch-measure-patch.yml
          git commit -m "Improve touch point placement for drawing measurements"
          git push
