name: Add drawing palette v1
on:
  push:
    paths:
      - '.github/workflows/add-drawing-palette-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add drawing palette and infrastructure objects
        shell: python
        run: |
          from pathlib import Path
          p=Path('studio/src/ProjectDocumentsWorkspace.tsx')
          s=p.read_text()
          s=s.replace("type PageState={calibration?:Calibration;scale?:number;measurements:Measurement[];angles?:AngleMeasurement[]};", "type UtilityKind='water'|'sewer'|'electric'|'fiber';\ntype UtilityLine={id:string;kind:UtilityKind;a:Point;b:Point;label?:string;visible:boolean};\ntype SymbolKind='water-service'|'shutoff'|'septic'|'inspection-well'|'meter-cabinet'|'meter-pole'|'fiber-well'|'connection';\ntype DrawingSymbol={id:string;kind:SymbolKind;point:Point;label?:string;visible:boolean};\ntype PageState={calibration?:Calibration;scale?:number;measurements:Measurement[];angles?:AngleMeasurement[];utilityLines?:UtilityLine[];symbols?:DrawingSymbol[]};")
          s=s.replace("type Tool='hand'|'calibrate'|'measure'|'angle';", "type Tool='hand'|'calibrate'|'measure'|'angle'|'utility'|'symbol';")
          needle="const[documents,setDocuments]=useState<ProjectDocument[]>([]);"
          s=s.replace(needle, "const[paletteOpen,setPaletteOpen]=useState<'tools'|'lines'|'symbols'|'layers'>('tools');const[utilityKind,setUtilityKind]=useState<UtilityKind>('water');const[symbolKind,setSymbolKind]=useState<SymbolKind>('water-service');const[layerVisibility,setLayerVisibility]=useState<Record<string,boolean>>({measure:true,water:true,sewer:true,electric:true,fiber:true,symbols:true});"+needle)
          marker="point=snapToDrawing(point,objectSnap);if(pending.length>=1&&!objectSnap)point=snapPoint(pending[0],point,e.shiftKey);const next=[...pending,point];"
          repl="point=snapToDrawing(point,objectSnap);if(tool==='symbol'){updatePage({...pageState,symbols:[...(pageState.symbols||[]),{id:crypto.randomUUID(),kind:symbolKind,point,label:'',visible:true}]});return}if(pending.length>=1&&!objectSnap)point=snapPoint(pending[0],point,e.shiftKey);const next=[...pending,point];"
          assert marker in s;s=s.replace(marker,repl)
          marker="if(next.length<2){setPending(next);return}setPending([]);if(tool==='calibrate'){"
          repl="if(next.length<2){setPending(next);return}setPending([]);if(tool==='utility'){updatePage({...pageState,utilityLines:[...(pageState.utilityLines||[]),{id:crypto.randomUUID(),kind:utilityKind,a:next[0],b:next[1],label:'',visible:true}]});return}if(tool==='calibrate'){"
          assert marker in s;s=s.replace(marker,repl)
          old="<div className=\"drawingTools\"><button className={tool==='hand'?'active':''} onClick={()=>{setTool('hand');setPending([])}}>✋ Hand</button><button className={tool==='calibrate'?'active':''} onClick={()=>{setTool('calibrate');setPending([])}}>↔ Kalibrera</button><button className={tool==='measure'?'active':''} onClick={()=>{setTool('measure');setPending([])}} disabled={!pageState.calibration&&!pageState.scale}>📏 Mät</button><button className={tool==='angle'?'active':''} onClick={()=>{setTool('angle');setPending([])}}>∠ Vinkel</button><button onClick={()=>setShowMeasurements(v=>!v)}>{showMeasurements?'◉ Dölj mått':'○ Visa mått'}</button>"
          new="<div className=\"drawingTools\"><button onClick={()=>setShowMeasurements(v=>!v)}>{showMeasurements?'◉ Dölj mått':'○ Visa mått'}</button>"
          assert old in s;s=s.replace(old,new)
          marker='<div className="drawingBody"><div ref={viewportRef}'
          palette='''<div className="drawingBody"><aside className="drawingPalette"><div className="drawingPaletteTabs"><button className={paletteOpen==='tools'?'active':''} onClick={()=>setPaletteOpen('tools')}>⌖<span>Verktyg</span></button><button className={paletteOpen==='lines'?'active':''} onClick={()=>setPaletteOpen('lines')}>╱<span>Ledningar</span></button><button className={paletteOpen==='symbols'?'active':''} onClick={()=>setPaletteOpen('symbols')}>◇<span>Symboler</span></button><button className={paletteOpen==='layers'?'active':''} onClick={()=>setPaletteOpen('layers')}>▱<span>Lager</span></button></div><div className="drawingPalettePanel">{paletteOpen==='tools'&&<><small>VERKTYG</small><button className={tool==='hand'?'active':''} onClick={()=>{setTool('hand');setPending([])}}>✋ Hand / markera</button><button className={tool==='calibrate'?'active':''} onClick={()=>{setTool('calibrate');setPending([])}}>↔ Kalibrera</button><button className={tool==='measure'?'active':''} disabled={!pageState.calibration&&!pageState.scale} onClick={()=>{setTool('measure');setPending([])}}>📏 Längdmått</button><button className={tool==='angle'?'active':''} onClick={()=>{setTool('angle');setPending([])}}>∠ Vinkel</button></>}{paletteOpen==='lines'&&<><small>RITA LEDNING</small>{([['water','💧','Vatten'],['sewer','↘','Spillvatten'],['electric','⚡','El'],['fiber','⌁','Fiber']] as const).map(([kind,icon,name])=><button key={kind} className={tool==='utility'&&utilityKind===kind?'active':''} onClick={()=>{setUtilityKind(kind);setTool('utility');setPending([])}}><span>{icon}</span>{name}</button>)}<p>Klicka start- och slutpunkt. Shift låser riktningen.</p></>}{paletteOpen==='symbols'&&<><small>PLACERA SYMBOL</small>{([['water-service','◉','Vattenservis'],['shutoff','⊗','Avstängningsventil'],['septic','▣','Trekammarbrunn'],['inspection-well','○','Brunn'],['meter-cabinet','▤','El-/mätarskåp'],['meter-pole','⚑','Mätstolpe'],['fiber-well','◎','Fiberbrunn'],['connection','◆','Anslutningspunkt']] as const).map(([kind,icon,name])=><button key={kind} className={tool==='symbol'&&symbolKind===kind?'active':''} onClick={()=>{setSymbolKind(kind);setTool('symbol');setPending([])}}><span>{icon}</span>{name}</button>)}<p>Välj symbol och klicka på ritningen för att placera den.</p></>}{paletteOpen==='layers'&&<><small>LAGER</small>{([['measure','Mått'],['water','Vatten'],['sewer','Spillvatten'],['electric','El'],['fiber','Fiber'],['symbols','Symboler']] as const).map(([key,name])=><label key={key}><input type="checkbox" checked={layerVisibility[key]!==false} onChange={()=>setLayerVisibility(v=>({...v,[key]:v[key]===false}))}/><span>{name}</span></label>)}</>}</div></aside><div ref={viewportRef}'''
          assert marker in s;s=s.replace(marker,palette)
          s=s.replace('showMeasurements={showMeasurements} measuredMm={measuredMm}', "showMeasurements={showMeasurements&&layerVisibility.measure!==false} measuredMm={measuredMm}")
          s=s.replace('showMeasurements={showMeasurements} onChange={setAngleGeometry}', "showMeasurements={showMeasurements&&layerVisibility.measure!==false} onChange={setAngleGeometry}")
          marker="<Magnifier target={isPdf?canvasRef.current:imageRef.current} point={cursorPoint} visible={tool!=='hand'}/>"
          repl="<InfrastructureOverlay targetRef={isPdf?canvasRef:imageRef} lines={pageState.utilityLines||[]} symbols={pageState.symbols||[]} layers={layerVisibility}/><Magnifier target={isPdf?canvasRef.current:imageRef.current} point={cursorPoint} visible={tool!=='hand'}/>"
          assert marker in s;s=s.replace(marker,repl)
          marker='function readState(projectId:string):DrawingState'
          component=r'''const UTILITY_STYLE:Record<UtilityKind,{stroke:string;dash?:string;name:string}>={water:{stroke:'#1479c9',name:'Vatten'},sewer:{stroke:'#8b5a2b',name:'Spillvatten'},electric:{stroke:'#d4a000',name:'El'},fiber:{stroke:'#8a45b8',dash:'6 4',name:'Fiber'}};
const SYMBOL_META:Record<SymbolKind,{glyph:string;name:string}>={'water-service':{glyph:'VS',name:'Vattenservis'},shutoff:{glyph:'AV',name:'Avstängningsventil'},septic:{glyph:'3K',name:'Trekammarbrunn'},'inspection-well':{glyph:'B',name:'Brunn'},'meter-cabinet':{glyph:'EL',name:'El-/mätarskåp'},'meter-pole':{glyph:'MS',name:'Mätstolpe'},'fiber-well':{glyph:'FB',name:'Fiberbrunn'},connection:{glyph:'A',name:'Anslutningspunkt'}};
function InfrastructureOverlay({targetRef,lines,symbols,layers}:{targetRef:React.RefObject<HTMLCanvasElement|null>|React.RefObject<HTMLImageElement|null>;lines:UtilityLine[];symbols:DrawingSymbol[];layers:Record<string,boolean>}){const[size,setSize]=useState({w:0,h:0});useEffect(()=>{const t=targetRef.current;if(!t)return;const update=()=>{const r=t.getBoundingClientRect();setSize({w:r.width,h:r.height})};update();const ro=new ResizeObserver(update);ro.observe(t);return()=>ro.disconnect()},[targetRef.current]);if(!size.w||!size.h)return null;return <svg className="infrastructureOverlay" width={size.w} height={size.h} style={{position:'absolute',left:targetRef.current?.offsetLeft||0,top:targetRef.current?.offsetTop||0,pointerEvents:'none',zIndex:2}}>{lines.filter(l=>l.visible&&layers[l.kind]!==false).map(l=>{const st=UTILITY_STYLE[l.kind];return <g key={l.id}><line x1={l.a.x*size.w} y1={l.a.y*size.h} x2={l.b.x*size.w} y2={l.b.y*size.h} stroke={st.stroke} strokeWidth="3" strokeDasharray={st.dash}/><circle cx={l.a.x*size.w} cy={l.a.y*size.h} r="3" fill="#fff" stroke={st.stroke} strokeWidth="2"/><circle cx={l.b.x*size.w} cy={l.b.y*size.h} r="3" fill="#fff" stroke={st.stroke} strokeWidth="2"/></g>})}{symbols.filter(x=>x.visible&&layers.symbols!==false).map(x=>{const m=SYMBOL_META[x.kind],cx=x.point.x*size.w,cy=x.point.y*size.h;return <g key={x.id}><circle cx={cx} cy={cy} r="12" fill="#fff" stroke="#244b37" strokeWidth="2"/><text x={cx} y={cy+3.5} textAnchor="middle" fontSize="8" fontWeight="900" fill="#244b37">{m.glyph}</text></g>})}</svg>}

function readState(projectId:string):DrawingState'''
          assert marker in s;s=s.replace(marker,component)
          p.write_text(s)
      - name: Style palette
        shell: bash
        run: |
          cat >> studio/src/project-documents-workspace.css <<'CSS'

          /* Drawing/CAD palette v1 */
          .drawingBody{grid-template-columns:220px minmax(0,1fr) 240px}
          .drawingPalette{background:#f8faf9;border-right:1px solid #d8e1db;display:grid;grid-template-columns:58px minmax(0,1fr);min-height:0;overflow:hidden}
          .drawingPaletteTabs{background:#244b37;padding:7px 5px;display:flex;flex-direction:column;gap:5px}.drawingPaletteTabs button{border:0;background:transparent;color:#dce9e1;border-radius:8px;min-height:52px;font-size:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.drawingPaletteTabs button span{font-size:8px;font-weight:800}.drawingPaletteTabs button.active{background:#3a624d;color:#fff}
          .drawingPalettePanel{padding:12px 9px;overflow:auto;display:flex;flex-direction:column;gap:6px}.drawingPalettePanel>small{font-size:9px;font-weight:900;letter-spacing:.11em;color:#708177;margin:2px 3px 5px}.drawingPalettePanel>button{border:1px solid #d5dfd9;background:#fff;color:#33443a;border-radius:7px;padding:8px;text-align:left;font-size:10px;font-weight:800;cursor:pointer}.drawingPalettePanel>button.active{background:#e6f0e9;border-color:#4c765e;color:#1f4b33}.drawingPalettePanel>button>span{display:inline-block;width:22px;text-align:center;margin-right:4px}.drawingPalettePanel p{font-size:9px;line-height:1.4;color:#738078;margin:5px 3px}.drawingPalettePanel label{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;padding:5px 2px}.infrastructureOverlay text{font-family:inherit}
          @media(max-width:1150px){.drawingBody{grid-template-columns:170px minmax(0,1fr) 200px}.drawingPalette{grid-template-columns:50px minmax(0,1fr)}}
          CSS
      - name: Build Studio
        run: cd studio && npm ci && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/src/ProjectDocumentsWorkspace.tsx studio/src/project-documents-workspace.css
          git commit -m "Add drawing palette with utilities symbols and layers"
          git push