name: Apply project navigation patch
on:
  push:
    branches:
      - main
    paths:
      - studio/scripts/apply_project_navigation_patch.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python studio/scripts/apply_project_navigation_patch.py
      - name: Build Studio
        working-directory: studio
        run: npm ci && npm run build
      - name: Commit result
        run: |
          git config user.name byggplan-bot
          git config user.email byggplan-bot@users.noreply.github.com
          rm studio/scripts/apply_project_navigation_patch.py
          rm .github/workflows/apply-project-navigation-patch.yml
          git add studio/src/StudioShell.tsx studio/src/ProjectWorkspace.tsx studio/src/main.tsx studio/scripts/apply_project_navigation_patch.py .github/workflows/apply-project-navigation-patch.yml
          git commit -m "Move project creation into project navigation"
          git push
