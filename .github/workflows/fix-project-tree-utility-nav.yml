name: Fix project tree utility navigation
on:
  push:
    paths:
      - 'studio/scripts/fix_project_tree_and_utility_nav.py'
      - '.github/workflows/fix-project-tree-utility-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python studio/scripts/fix_project_tree_and_utility_nav.py
      - name: Build Studio
        run: cd studio && npm ci && npm run build
      - name: Commit result
        run: |
          git config user.name byggplan-bot
          git config user.email byggplan-bot@users.noreply.github.com
          git add studio/src
          git commit -m "Separate project tree from utility navigation" || exit 0
          git push
