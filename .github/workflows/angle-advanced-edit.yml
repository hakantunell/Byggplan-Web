name: Advanced angle editing and object snapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/angle-advanced-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/angle_advanced_patch.py
      - name: Build app
        run: npm install --progress=false && npm run build
      - name: Build Studio
        working-directory: studio
        run: npm install --progress=false && npm run build
      - name: Commit result and cleanup
        run: |
          git config user.name "byggplan-bot"
          git config user.email "byggplan-bot@users.noreply.github.com"
          rm .github/workflows/angle-advanced-edit.yml scripts/angle_advanced_patch.py
          git add studio/src/ProjectDocumentsWorkspace.tsx src/DrawingAnnotations.tsx .github/workflows/angle-advanced-edit.yml scripts/angle_advanced_patch.py
          git commit -m "Improve angle editing and add drawing object snapping"
          git push
# retry after TypeScript fix
