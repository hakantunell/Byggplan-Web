name: Fix project page labels
on:
  push:
    branches: [main]
    paths:
      - studio/scripts/fix_project_page_labels.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python studio/scripts/fix_project_page_labels.py
      - name: Build Studio
        working-directory: studio
        run: npm ci && npm run build
      - name: Commit result
        run: |
          git config user.name byggplan-bot
          git config user.email byggplan-bot@users.noreply.github.com
          rm studio/scripts/fix_project_page_labels.py
          rm .github/workflows/fix-project-page-labels.yml
          git add studio/src/StudioShell.tsx studio/src/ProjectWorkspace.tsx studio/scripts/fix_project_page_labels.py .github/workflows/fix-project-page-labels.yml
          git commit -m "Show correct labels for project subpages"
          git push
